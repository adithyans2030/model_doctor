name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + API tests
        run: pytest
      - name: Migrations match the models
        env:
          MD_DATA_DIR: ${{ runner.temp }}/md
        run: |
          alembic upgrade head
          alembic check
      - name: End-to-end pipeline on both demo datasets
        run: |
          python scripts/run_pipeline.py --csv ../sample_data/churn_demo.csv --target churned --budget quick --out ../reports
          python scripts/run_pipeline.py --csv ../sample_data/house_prices_demo.csv --target price --budget quick --out ../reports/regression
      - uses: actions/upload-artifact@v4
        with:
          name: diagnosis-report
          path: reports/

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modeldoctor
          POSTGRES_PASSWORD: modeldoctor
          POSTGRES_DB: modeldoctor
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U modeldoctor" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MD_DATABASE_URL: postgresql+psycopg://modeldoctor:modeldoctor@localhost:5432/modeldoctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt "psycopg[binary]>=3.2"
      - name: Migrations apply cleanly on Postgres
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser tests (starts its own backend and dashboard)
        run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
          PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t modeldoctor-api ./backend
      - run: docker build -t modeldoctor-web --build-arg VITE_API_URL=http://localhost:8000 ./frontend
      - name: Kubernetes manifests render
        run: kubectl kustomize deploy/k8s > /dev/null
