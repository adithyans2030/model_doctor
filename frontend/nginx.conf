server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Note: nginx drops server-level add_header directives in any location that has its
  # own add_header, so the security headers are repeated in each location.

  # Hashed build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri =404;
  }

  # Single-page app: let React Router handle every other path.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri $uri/ /index.html;
  }
}
