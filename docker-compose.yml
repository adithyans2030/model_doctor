# Full stack:  docker compose up --build
#   Dashboard   http://localhost:3000
#   API docs    http://localhost:8000/docs
#   MLflow      http://localhost:5000
#   Prometheus  http://localhost:9090
#   Grafana     http://localhost:3001  (dashboard "ModelDoctor", anonymous viewer)
#
# Secrets come from a .env file next to this one (see .env.example); nothing is hard-coded
# except local-only development passwords.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modeldoctor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modeldoctor}
      POSTGRES_DB: modeldoctor
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modeldoctor"]
      interval: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "5000:5000"

  api:
    build: ./backend
    environment:
      MD_DATABASE_URL: postgresql+psycopg://modeldoctor:${POSTGRES_PASSWORD:-modeldoctor}@db:5432/modeldoctor
      MD_MLFLOW_TRACKING_URI: http://mlflow:5000
      MD_CORS_ORIGINS: '["http://localhost:3000"]'
      MD_API_KEYS: ${MD_API_KEYS:-[]}
      # The assistant uses the Ollama running on your machine (outside Docker).
      MD_OLLAMA_URL: ${MD_OLLAMA_URL:-http://host.docker.internal:11434}
      MD_OLLAMA_MODEL: ${MD_OLLAMA_MODEL:-llama3.1:latest}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pg-data:
  mlflow-data:
  api-data:
