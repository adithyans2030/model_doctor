# Deploy:   kubectl apply -k deploy/k8s
# Preview:  kubectl kustomize deploy/k8s
# Images are published to GHCR by .github/workflows/release.yml; set the tag below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: modeldoctor
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
images:
  - name: modeldoctor-api
    newName: ghcr.io/adithyans2030/model_doctor-api
    newTag: latest
  - name: modeldoctor-web
    newName: ghcr.io/adithyans2030/model_doctor-web
    newTag: latest
